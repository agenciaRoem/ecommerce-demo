# Uso: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# Expone Postgres y Redis SOLO en localhost para herramientas de desarrollo.
services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"
    networks: [internal, public] # una red `internal` no puede publicar puertos al host
  redis:
    ports:
      - "127.0.0.1:6379:6379"
    networks: [internal, public]
