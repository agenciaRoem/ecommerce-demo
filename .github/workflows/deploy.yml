name: Deploy

# Se publica al crear una versión (git tag v1.2.3) o a mano desde la pestaña Actions.
# El paso de despliegue usa el entorno "production": en GitHub se le puede exigir aprobación antes de correr.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Etiqueta de las imágenes a desplegar (ej. v1.2.3 o un SHA)
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false # nunca se interrumpe un despliegue a medias

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  images:
    name: Publicar imágenes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          [[ "$REQUESTED_TAG" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "Etiqueta inválida"; exit 1; }
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ env.REGISTRY }}/omnistock-backend:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Backend (migraciones y herramientas)
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: build
          push: true
          tags: ${{ env.REGISTRY }}/omnistock-backend-tools:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=backend
      - name: Frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ env.REGISTRY }}/omnistock-frontend:${{ steps.tag.outputs.tag }}
          # La dirección pública de la API se incrusta al compilar (variable del repositorio).
          build-args: NEXT_PUBLIC_API_URL=${{ vars.PUBLIC_API_URL }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Desplegar en el servidor
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Clave SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Ejecutar deploy/deploy.sh en el servidor
        env:
          TAG: ${{ needs.images.outputs.tag }}
          DEPLOY_TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/omnistock' }}
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes -p "$DEPLOY_PORT" "$DEPLOY_TARGET" \
            "cd '$DEPLOY_PATH' && ./deploy/deploy.sh '$TAG'"
