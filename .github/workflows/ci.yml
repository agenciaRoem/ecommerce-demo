name: CI

on:
  push:
    branches: [main]
  pull_request:

# Una corrida nueva sobre la misma rama cancela la anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, tipos, unitarias, integración)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: omnistock
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U omnistock" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Base y Redis descartables: la suite recrea la base `omnistock_test` en cada corrida.
      E2E_DATABASE_URL: postgresql://omnistock:ci-password@localhost:5432/omnistock_test
      E2E_REDIS_URL: redis://localhost:6379/1
      DATABASE_URL: postgresql://omnistock:ci-password@localhost:5432/omnistock_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - name: Dependencias vulnerables (producción)
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend (lint, tipos, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com
      - name: Dependencias vulnerables (producción)
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Imágenes y configuración de despliegue
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Compose de producción válido
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
        env:
          APP_DOMAIN: tienda.example.com
          ACME_EMAIL: admin@tienda.example.com
          POSTGRES_USER: x
          POSTGRES_PASSWORD: x
          POSTGRES_DB: x
          REDIS_PASSWORD: x
          JWT_ACCESS_SECRET: x
          JWT_REFRESH_SECRET: x
          SETTINGS_ENCRYPTION_KEY: x
      - name: Compilar imagen del backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: omnistock-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Compilar imagen del frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          load: true
          tags: omnistock-frontend:ci
          build-args: NEXT_PUBLIC_API_URL=https://api.example.com
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Escaneo de vulnerabilidades (backend)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: omnistock-backend:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Escaneo de vulnerabilidades (frontend)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: omnistock-frontend:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  secrets:
    name: Secretos en el código
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ui:
    name: Pantallas en un navegador (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configuración de la pila de prueba
        run: |
          {
            echo "POSTGRES_USER=omnistock"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "POSTGRES_DB=omnistock"
            echo "REDIS_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_ACCESS_SECRET=$(openssl rand -base64 48)"
            echo "JWT_REFRESH_SECRET=$(openssl rand -base64 48)"
            echo "SETTINGS_ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "COOKIE_SECURE=false"
            echo "TRUST_PROXY=1"
            echo "SEED_SUPERADMIN_EMAIL=admin@omnistock.local"
            echo "SEED_SUPERADMIN_PASSWORD=Ci-Admin-Passw0rd-1"
            echo "SEED_DEMO_STAFF_PASSWORD=Ci-Demo-Passw0rd-1"
            echo "SEED_DEMO_CATALOG=false"
          } > .env
      - name: Levantar la pila
        run: |
          docker compose up -d --build postgres redis backend frontend
          docker compose --profile tools run --rm migrate
          docker compose --profile tools run --rm migrate npx prisma db seed
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Correr las pruebas
        working-directory: frontend
        env:
          E2E_ADMIN_PASSWORD: Ci-Admin-Passw0rd-1
          E2E_DEMO_PASSWORD: Ci-Demo-Passw0rd-1
        run: npx playwright test
      - name: Registros de la pila si algo falló
        if: failure()
        run: docker compose logs --tail=200
      - name: Informe de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
